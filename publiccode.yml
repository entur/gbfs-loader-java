description:
  en:
    localisedName: gbfs-loader-java
    shortDescription: Java library that loads GBFS feeds and keeps them updated from ttl and last_updated.
    longDescription: >
      gbfs-loader-java handles the fetching side of consuming shared mobility data published as General Bikeshare
      Feed Specification (GBFS) feeds. Given the URL of a system's discovery file, a loader resolves every other
      file the system publishes, deserialises them into the generated types from gbfs-java-model, and refreshes
      each file according to its own ttl and last_updated fields, so callers do not have to implement per-file
      polling themselves.
      Both GBFS v2 and v3 are supported through separate factory methods, with the language code required only
      for v2. Feeds that require authentication are handled through a pluggable RequestAuthenticator, and request
      timeouts can be overridden per loader.
    documentation: https://github.com/entur/gbfs-loader-java/blob/master/README.md
    features:
      - Loads all feed files of a GBFS system from its discovery file
      - Per-file refresh driven by ttl and last_updated
      - Support for GBFS v2 and v3
      - Deserialisation into the generated gbfs-java-model types
      - Pluggable authentication for protected feeds

